name: Pull Request Tests

on:
  pull_request:
    branches:
      - main

# Use concurrency to ensure that only one instance of this workflow is running at a time
concurrency:
  group: pr-tests-${{ github.ref_name }}
  cancel-in-progress: true

# installs mamba-org/setup-micromamba@v2 on all 3 platforms using matrix and runs pytest:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
            with:
              ref: ${{ github.event.pull_request.head.sha || github.ref }}

          - uses: prefix-dev/setup-pixi@v0.10.2 # https://github.com/prefix-dev/setup-pixi
            with:
              pixi-version: v0.68.0
              cache: true
              environments: lint

          # NOT `pixi run lint`: that is black + `ruff check --fix` + isort, which all MUTATE the
          # runner's checkout and exit 0 — so this job reformatted a throwaway copy and passed
          # unconditionally. lint-check reports instead of rewriting.
          - run: pixi run lint-check

    test:
        runs-on: ${{ matrix.os }}
        defaults:
          run:
            shell: bash -l {0}
        strategy:
          fail-fast: false
          matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ github.event.pull_request.head.sha || github.ref }}

        - uses: prefix-dev/setup-pixi@v0.10.2
          with:
            pixi-version: v0.68.0
            environments: tests
            cache: true

        - name: Runs Tests
          run: pixi run -e tests test

    test-cad-parity:
        name: Test CAD backend parity (PR)
        runs-on: ubuntu-latest
        # Mirrors test.yml's job of the same name. The cross-backend comparisons in
        # tests/core/cad/test_backend_parity.py skip unless pythonocc-core and ada-cpp are
        # both importable, and the `test` job above carries only pythonocc — so without this
        # leg the parity assertions would be green on a PR without ever having run.
        defaults:
          run:
            shell: bash -l {0}
        steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ github.event.pull_request.head.sha || github.ref }}

        - uses: prefix-dev/setup-pixi@v0.10.2
          with:
            pixi-version: v0.68.0
            environments: >-
              viewer-api-tests-adacpp
            cache: true

        - name: Run Tests
          run: pixi run -e viewer-api-tests-adacpp test-cad-parity

    # tests/comms/rest is excluded from the `test` task above (it needs the viewer-api stack, which
    # the `tests` env does not carry), so before this job the entire REST/viewer-API suite — the
    # largest single test directory in the repo — had NO presence in the pull_request workflow.
    #
    # It was not unrun: ci-branch-tests (.github/workflows/test.yml) has an identical job, and
    # because that workflow triggers on bare `on: push`, a same-repo branch push produces a check
    # run on the PR head SHA and it shows up in the PR's check list. That is what made the gap easy
    # to miss. Two things it does not cover:
    #
    #   1. FORK PRs. `on: push` fires in the fork, not here — an outside contributor's PR gets the
    #      pr-tests matrix (comms/rest excluded) and nothing else. Zero REST coverage, silently.
    #   2. It only reports for branches pushed to this repo, so it is not something branch
    #      protection can rely on being present on every PR.
    #
    # A `pull_request`-triggered job fixes both: it runs against the PR head for forks and same-repo
    # alike, so it is safe to mark as a REQUIRED status check.
    #
    # Deliberately Linux-only, unlike the 3-platform matrix above. The suite now runs clean on
    # Windows (it did not before this change), but two things make ubuntu the honest home for the
    # gate: GitHub `services:` containers are Linux-only, so the ~46 Postgres-backed admin/audit
    # tests can only really execute here, and the REST worker is Linux-only by construction
    # (os.fork + fcntl in subprocess_convert). Paying for a viewer-api env solve on macOS to run a
    # strictly smaller subset is not worth it.
    #
    # This duplicates test.yml's job on same-repo pushes, the same way test-core/test-full already
    # duplicate the matrix here. It mirrors that job exactly — same envs, same two legs — so the PR
    # gate and the branch job cannot drift into "green on the PR, red on the push".
    test-rest:
        name: Test viewer REST API (PR)
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_PASSWORD: test
              POSTGRES_DB: adapytest
            ports:
              - 5432:5432
            options: >-
              --health-cmd pg_isready
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        defaults:
          run:
            shell: bash -l {0}
        steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ github.event.pull_request.head.sha || github.ref }}

        - uses: prefix-dev/setup-pixi@v0.10.2
          with:
            pixi-version: v0.68.0
            environments: >-
              viewer-api-tests
              viewer-api-tests-adacpp
            cache: true

        - name: Run Tests
          env:
            ADA_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/adapytest
          run: pixi run -e viewer-api-tests test-rest

        # Streaming-path coverage against the native ada-cpp backend (tessellate_stream / NGEOM
        # libtess2), which the adacpp-less leg above can only reach via the OCC object-path
        # fallback. No Postgres needed.
        - name: Run streaming-path tests (ada-cpp backend)
          run: pixi run -e viewer-api-tests-adacpp test-rest-adacpp

    # The committed viewer bundle (src/ada/visit/rendering/resources/index.zip) is a compiled
    # binary shipped as package data inside every wheel, and it is the one file in the tree that a
    # text diff cannot show you: a pull request that rebuilt it on a machine with out-of-tree plugin
    # overlays enabled absorbed the compiled source of packages from other repositories, and the
    # diff read `Bin 776265 -> 1002877 bytes`. Nobody reviews that.
    #
    # This asserts every UI string in the blob traces back to src/frontend. It needs node_modules
    # for the corpus (vendored strings are legitimately in the bundle and absent from src/), which
    # is why it installs first and why it is its own job rather than a step bolted onto a pixi one.
    bundle-provenance:
        name: Viewer bundle provenance
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ github.event.pull_request.head.sha || github.ref }}
            # The scope check below diffs against the PR base, which needs real history.
            fetch-depth: 0

        # Only the bundle, the frontend sources it is checked against, or the checker itself can
        # change the answer. Done inline rather than as an `on: pull_request: paths:` filter so the
        # job always reports a status and can be a required check.
        - name: Does this PR touch the bundle or its corpus?
          id: scope
          env:
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
          run: |
            CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD || true)"
            if echo "$CHANGED" | grep -qE '^(src/frontend/|src/ada/visit/rendering/resources/index\.zip$|tools/(check_bundle_provenance\.py|bundle_provenance_baseline\.txt)$)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Neither the bundle nor src/frontend changed; nothing to re-verify."
            fi

        - uses: actions/setup-node@v7
          if: steps.scope.outputs.run == 'true'
          with:
            node-version: '20'   # matches the frontend-build stage of deploy/Dockerfile.viewer
            cache: npm
            cache-dependency-path: src/frontend/package-lock.json

        # --ignore-scripts because the corpus only needs the packages' source text on disk; no
        # postinstall output is read, and skipping them keeps this the cheap job it should be.
        - name: Install frontend dependencies
          if: steps.scope.outputs.run == 'true'
          working-directory: src/frontend
          run: npm ci --no-audit --no-fund --ignore-scripts

        - name: Check bundle provenance
          if: steps.scope.outputs.run == 'true'
          run: python3 tools/check_bundle_provenance.py -v

    # Build the viewer image and start the server inside it. Nothing else in this workflow can catch
    # a viewer that won't boot: lint and the test matrix run against the full src/ada tree, but the
    # viewer runtime ships a CURATED subset of it (see the COPY block in deploy/Dockerfile.viewer),
    # so a module the REST app imports at startup can be missing from the image with every job here
    # green. 0.30.0 shipped exactly that and crashlooped on `No module named 'ada.cad'` — and the
    # worker image from the same commit was healthy, which is what hid it. The tag-only publish
    # workflow gates the same thing, but that is a release-time backstop; this is the one that keeps
    # it out of main.
    viewer-image:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          # deploy/Dockerfile.viewer FROMs the adacpp wasm base on ghcr (a cross-repo package).
          packages: read
        steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ github.event.pull_request.head.sha || github.ref }}
            # The scope check below diffs against the PR base, which needs real history.
            fetch-depth: 0

        # This build is the expensive one in the repo (SPA + pixi solve + the adacpp wasm base), so
        # a docs-only PR shouldn't pay for it — but anything that can change what lands in the image
        # must. Mirrors the viewer scope in .forgejo/workflows/build.yaml's detect job. Done inline
        # rather than as an `on: pull_request: paths:` filter so the job always reports a status:
        # a path-filtered workflow that never runs leaves a required check pending forever.
        - name: Does this PR affect the viewer image?
          id: scope
          env:
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
          run: |
            CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD || true)"
            if printf '%s\n' "$CHANGED" | grep -qE '^(src/ada/|src/frontend/|deploy/Dockerfile\.viewer(-fast)?$|deploy/viewer-(ada-init|smoke)\.py$|pixi\.(toml|lock)$|pyproject\.toml$|\.github/workflows/pr-tests\.yml$)'; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "No viewer-affecting paths in this PR; skipping the image build."
            fi

        - uses: docker/setup-buildx-action@v4
          if: steps.scope.outputs.build == 'true'

        - name: Log in to GitHub Container Registry
          if: steps.scope.outputs.build == 'true'
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build viewer image
          if: steps.scope.outputs.build == 'true'
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./deploy/Dockerfile.viewer
            # Never pushed — built only to be started. ADACPP_BASE_IMAGE is deliberately not passed
            # so the pin in deploy/Dockerfile.viewer stands; see publish-image.yaml.
            push: false
            load: true
            tags: adapy-viewer:pr
            build-args: |
              IMAGE_TAG=pr-${{ github.event.pull_request.number }}
            # Read the release cache when it's reachable, but write a PR-scoped one: a PR can only
            # restore caches from its base branch or its own, so tag-built layers usually aren't
            # visible here. First run on a PR is cold; later pushes to it hit this.
            cache-from: |
              type=gha,scope=viewer-pr
              type=gha,scope=viewer
            cache-to: type=gha,mode=max,scope=viewer-pr

        - name: Smoke-test the viewer image
          if: steps.scope.outputs.build == 'true'
          run: |
            docker run --rm -i --entrypoint sh adapy-viewer:pr \
              -c 'exec /env/bin/python -' < deploy/viewer-smoke.py