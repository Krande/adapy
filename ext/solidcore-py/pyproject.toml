[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "solidcore-py"
version = "0.0.1"
description = "EXPERIMENTAL: thin PyO3 binding of the solidcore B-rep kernel for adapy's prototype backend"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.maturin]
features = ["pyo3/extension-module"]
