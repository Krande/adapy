# Build config for `paradoc build verification`.
#
# All tasks run in the controlling Python process — adapy + gmsh +
# solver invocations are already orchestrated through the existing
# pixi env. No subprocess-per-cell isolation needed (and no pixi_toml
# reference), since adapy's verification report is exactly the
# special case noted in the docs: a document that uses its hosting
# package's own pixi env.
#
# When/if we want concurrent solver runs across an in-process worker
# pool, add `[paradoc] pixi_toml = "../pixi.toml"` plus
# `[paradoc.envs]` aliases and tag each task with `env=...`.

[paradoc]
# Markdown lives in `report/` while tasks.py / filters.py stay at the
# doc root. paradoc.tasks honors this override and pre-registers
# filters from the doc root rather than `source_dir`.
source_dir = "report"

# Default profile: the full 5-axis verification matrix declared in
# tasks.py runs unchanged. No fanout overrides needed. The static
# bundle target is the adapy docs landing page; `../../index.html`
# walks the bundle index back to the Sphinx-served docs root.
[build.default]
outputs = ["static"]

[build.default.static]
target = "../docs/_static/fea-report"
header_links = [
    { label = "← adapy docs", href = "../../index.html" },
]

# Download profiles: the same full matrix as `default`, compiled to a single file instead of the
# web bundle. Separate profiles rather than extra `default` outputs, so a failing DOCX/PDF export
# can't take the web report down with it. The `fea-doc-docx` / `fea-doc-pdf` pixi tasks run these
# and copy the file into `docs/_static/fea-report-files/`, which the docs page links to.
[build.docx]
outputs = ["docx"]

[build.pdf]
outputs = ["pdf"]

# PDF layout, tuned for this report: hundreds of captioned mode-shape posters and comparison
# tables up to eleven numeric columns wide. Every key is optional (paradoc's defaults are the
# same values); they are spelled out so the layout can be adjusted here.
[build.pdf.pdf]
papersize = "a4"
fontsize = "10pt"
geometry = "margin=2cm"             # the widest comparison table needs the full text width
# mainfont / monofont: unset = a system font with Greek and superscript glyphs (ρ, ⁴)
figure_max_height = 0.42            # of the text height: two captioned posters per page
figure_max_width = 0.85             # of the line width
figure_placement = "H"              # keep each poster under its mode heading
figure_trim_whitespace = true       # posters are mostly empty background; crop it
figure_trim_padding = 0.04
block_headings = true               # "#### Mode N" stays above its figures
table_font_size = "footnotesize"
table_col_sep = "3pt"
table_col_widths = "content"        # numeric tables: natural widths; prose tables still wrap
table_short_cell_chars = 24

# Smoke profile: minimal cell count for quick iteration / CI sanity.
# One mesh cell × one solver = ~1 cell post-skip.
[build.smoke]
outputs = ["static"]

[build.smoke.static]
target = "../docs/_static/fea-report"
header_links = [
    { label = "← adapy docs", href = "../../index.html" },
]

[build.smoke.fanout.mesh]
geom_repr = ["shell"]
elem_order = [1]
use_hex_quad = [false]
reduced_integration = [false]

[build.smoke.fanout.run_eig]
solver = ["calculix"]

# Plate profile: the plate strip cases at full fanout, with the cantilever matrix narrowed to a
# single cheap cell. For iterating on the plate section, and for seeding `.cache-plate/` on a
# machine that has the free solvers -- the cantilever's own cache is already committed, so
# re-running its 42 cells to look at a plate table is pure waste.
[build.plate]
outputs = ["static"]

[build.plate.static]
target = "../docs/_static/fea-report"
header_links = [
    { label = "← adapy docs", href = "../../index.html" },
]

[build.plate.fanout.mesh]
geom_repr = ["shell"]
elem_order = [1]
use_hex_quad = [true]
reduced_integration = [false]

[build.plate.fanout.run_eig]
solver = ["calculix"]
