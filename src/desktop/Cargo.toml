[package]
name = "ada-desktop"
version = "0.1.0"
edition = "2021"
description = "Native window shell for the adapy local viewer"
license = "GPL-3.0-or-later"
repository = "https://github.com/Krande/adapy"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No default features: no tray, no updater, no bundled assets server beyond what a remote-URL
# window needs. `compression` keeps the (tiny) embedded config/ACL compressed.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "compression", "dynamic-acl"] }
tauri-plugin-window-state = "2"
serde_json = "1"
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

# Size first: the shell does almost nothing on its own, so speed is irrelevant and a small exe
# keeps the conda package small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
