name: Create Tag on PR Merge

# Thin wrapper: the release decision and the semantic-release invocation live in
# the `deputy` package (https://github.com/Krande/deputy). On a merged PR it
# reads the release-* label and, when a release is warranted, bumps the version,
# creates a vX.Y.Z tag, pushes it, and cuts a GitHub Release.
#
# Version locations come from deputy.toml's [release] table: pyproject.toml and
# src/frontend/package.json are bumped together so the python package and the
# frontend stay in lockstep.
#
# CRITICAL — the tag is pushed over SSH with the SOURCE_KEY deploy key, NOT the
# default GITHUB_TOKEN. A GITHUB_TOKEN-pushed tag does not trigger other
# workflows; a deploy-key push does — so the new tag still fires
# release-on-new-tag.yaml (on: push tags). Wired via
# `remote.ignore_token_for_push` in deputy's defaults: semantic-release pushes
# over the `origin` remote the checkout points at (SSH + SOURCE_KEY) and uses
# GH_TOKEN only for the Release API call.
#
# Requirements:
#   * secrets.SOURCE_KEY — a deploy key with WRITE access to this repo.
#   * Do not enable "Do not allow bypassing the above settings" in branch
#     protection, or the deploy-key push is rejected and no tag is created.
#
# Pinned to deputy @v0.4.0.

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  tag:
    name: Tag release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history; deploy-key auth so the tag push triggers CI)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # base branch (main) — the merge is already in
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "semantic-release"
          git config user.email "semantic-release@users.noreply.github.com"

      - name: Install deputy
        # TEMPORARY PIN (2026-08-25): GitPython 3.1.60 removed
        # `git.Actor.name_email_regex`. python-semantic-release reads that
        # attribute unconditionally at config load
        # (semantic_release/cli/config.py:294 in the 8.5.1 that deputy pins), so
        # with 3.1.60 every `semantic-release` subcommand dies with AttributeError
        # and no release is cut. deputy v0.4.0 leaves gitpython unconstrained, so a
        # fresh install resolves 3.1.60. Drop this pin once python-semantic-release
        # guards the attribute, or once deputy pins gitpython upstream.
        run: pip install "deputy @ git+https://github.com/Krande/deputy.git@v0.4.0" "gitpython<3.1.60"

      - name: Tag + release per the PR's release label
        run: deputy tag-on-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
