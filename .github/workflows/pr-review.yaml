name: Review Pull Request

# Thin wrapper: the logic lives in the `deputy` package
# (https://github.com/Krande/deputy), which is unit-tested locally rather than
# debugged by pushing commits and reading Actions logs. This workflow installs
# deputy and runs pr-review, which checks the PR (conventional title + exactly
# one release-* label), computes the next version for information, and
# posts/updates a single sticky comment.
#
# Config lives in deputy.toml at the repo root.
#
# This replaces a call to a reusable workflow referenced by a MOVING ref, from a
# `pull_request_target` workflow that held `contents: write` and was handed
# every repo secret. Anyone able to push to that ref could have run arbitrary
# code with this repository's credentials. deputy is pinned to an immutable
# tag, receives only GITHUB_TOKEN, and does not need `contents: write`.
#
# pull_request_target so the job (and GITHUB_TOKEN) can comment and label even
# on fork PRs. It checks out the BASE ref only and never runs any PR-head code.
#
# Pinned to deputy @v0.4.0.

on:
  pull_request_target:
    types: [opened, synchronize, edited, unlabeled]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: Check Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref (full history for the version calc)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # base branch — never the untrusted PR head
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deputy
        # TEMPORARY PIN (2026-08-25): GitPython 3.1.60 removed
        # `git.Actor.name_email_regex`. python-semantic-release reads that
        # attribute unconditionally at config load
        # (semantic_release/cli/config.py:294 in the 8.5.1 that deputy pins), so
        # with 3.1.60 every `semantic-release` subcommand dies with AttributeError
        # and no release is cut. deputy v0.4.0 leaves gitpython unconstrained, so a
        # fresh install resolves 3.1.60. Drop this pin once python-semantic-release
        # guards the attribute, or once deputy pins gitpython upstream.
        run: pip install "deputy @ git+https://github.com/Krande/deputy.git@v0.4.0" "gitpython<3.1.60"

      - name: Review the PR (checks + sticky comment); fails if a check fails
        run: deputy pr-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_SOURCE_KEY: ${{ secrets.SOURCE_KEY != '' }}
